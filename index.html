<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Y2K 다이어리</title>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu&family=Nanum+Pen+Script&family=Gowun+Dodum&family=Gamja+Flower&family=Hi+Melody&family=Single+Day&family=East+Sea+Dokdo&family=Poor+Story&family=Black+Han+Sans&family=Dokdo&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="tab-menu">
        <button class="tab-btn active" onclick="openTab(event, 'tab1')">1. 다이어리</button>
        <button class="tab-btn" onclick="openTab(event, 'tab2')">2. 이용수칙</button>
        <button class="tab-btn" onclick="openTab(event, 'tab3')">3. 보관함</button>
    </div>

    <div id="tab1" class="tab-content active">
        <div class="header">
            <button class="btn" id="prevBtn">◀</button>
            <h1 id="date">2026-04-22</h1>
            <button class="btn" id="nextBtn">▶</button>
        </div>
        <div id="canvas"></div>
        <div class="controls">
            <input type="file" id="upload" accept="image/*" style="display: none;" multiple>
            <button class="btn" onclick="document.getElementById('upload').click()">사진 추가</button>
            <button class="btn" id="addStickerBtn">코멘트 담기</button>
        </div>
    </div>

    <div id="tab2" class="tab-content">
        <div class="notice-container">
            <div class="timer-display">
                <div class="timer-label">오늘의 기록 마감까지</div>
                <div id="todayTimer" class="timer-digits">00:00:00:00</div>
            </div>
            <h2>📝 다이어리 이용 수칙</h2>
            <ul class="pixel-list">
                <li><strong>기록 동결:</strong> 날짜가 지나면 수정이 불가능한 것이 원칙입니다.</li>
                <li><strong>자동 저장:</strong> 자정이 되면 오늘의 일기는 '보관함'으로 자동 봉인됩니다.</li>
                <li><strong>보관함 스티커:</strong> 기록을 남긴 날에는 달력에 귀여운 스마일이 붙습니다.</li>
            </ul>
        </div>
    </div>

    <div id="tab3" class="tab-content">
        <div class="archive-container">
            <div class="calendar-header">
                <button class="btn" onclick="changeMonth(-1)">◀</button>
                <h2 id="calendarTitle">2026년 4월</h2>
                <button class="btn" onclick="changeMonth(1)">▶</button>
            </div>
            <div class="calendar-grid" id="calendarGrid"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
